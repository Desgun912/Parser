name: Krisha parser

on:
  schedule:
    # каждые 15 минут (UTC). Крон в GitHub Actions может запускаться
    # с задержкой в несколько минут — для личных целей это не критично.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # позволяет запустить вручную из вкладки Actions

permissions:
  contents: write   # нужно, чтобы сохранять seen_ids.json обратно в репозиторий

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser (Chromium)
        run: python -m playwright install chromium

      - name: Run scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: python scraper.py

      - name: Upload OLX debug files (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: olx-debug
          path: |
            olx_debug.png
            olx_debug.html
          if-no-files-found: ignore

      - name: Save seen_ids.json back to repo
        run: |
          git config user.name "krisha-parser-bot"
          git config user.email "actions@github.com"
          git add seen_ids.json
          git diff --staged --quiet || git commit -m "Обновление списка увиденных объявлений"
          git push
